[project]
name = "mech-interp-workbench"
version = "0.1.0"
description = "A small, local course and experiment notebook for mechanistic interpretability."
requires-python = ">=3.12,<3.13"
dependencies = [
    "jupyterlab>=4.4,<5",
    "ipywidgets>=8.1,<9",
    "torch>=2.5,<3",
    "einops>=0.8,<1",
    "matplotlib>=3.9,<4",
    "nbformat>=5.10,<6",
    "nbclient>=0.10,<1",
    "filelock>=3.16,<4",
    "pymupdf>=1.26,<2",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
